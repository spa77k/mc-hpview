name: HPView
version: '${project.version}'
main: dev.spa.hpview.HPViewPlugin
api-version: "1.21"
author: spa
description: Shows the remaining HP of the target you attack on your action bar

commands:
  hpview:
    description: Toggle the HP display on or off
    usage: /hpview [on|off]
    permission: hpview.toggle

permissions:
  hpview.use:
    description: Shows the HP of attacked targets
    default: true
  hpview.toggle:
    description: Allows toggling your own display with /hpview
    default: true
  hpview.reload:
    description: Allows reloading the config with /hpview reload
    default: op
